# ================================================================================
# Linux.do 自动浏览定时任务（CloakBrowser 有头运行）
# ================================================================================
#
# 功能：
#   - 定时/手动在 GitHub Actions 上运行命令行版（python main.py cli）
#   - CloakBrowser 隐身 Chromium 内核自动下载并缓存（约 200MB，首次后走缓存）
#   - 自动登录（账号密码来自 Secrets）并浏览帖子
#
# ================================================================================
# 为什么默认用 windows-latest 而不是 ubuntu
# ================================================================================
#
# CloakBrowser 在 Linux/Windows 上都会加 `--fingerprint-platform=windows`
# （它只在 macOS 上不伪装平台，源码注释写明：伪装会造成"字体/GPU 可检测的矛盾"）。
# 于是在 Linux runner 上：声称是 Windows，却没有 Windows 字体、没有真实 GPU、
# 时区是 UTC、网络栈是 Linux —— 每一项都与平台声明矛盾，Cloudflare 的 Turnstile
# 就会一直停在 Verifying… 永不完成（实测 6 个不同国家的机房节点全部如此）。
#
# 用 windows-latest 后，"Windows" 这个声明是【真的】：真实系统字体、真实显示
# 会话（不再需要 Xvfb）、Windows 网络栈 —— 与本机运行环境同类，自洽性最好。
#
# 代价与回退：
#   - 私有仓库 Windows runner 按 2 倍分钟计费（免费额度 2000 分钟/月通常够用）
#   - 想换回 Linux：把 runs-on 改回 ubuntu-latest 即可，Linux 专用步骤已用
#     `if: runner.os == 'Linux'` 保护，无需改其它地方
#
# 注意：runner 的出口 IP 仍是数据中心段。IP 信誉是 Cloudflare 打分的大头，
#      这一项只能靠住宅/家宽节点或 Tailscale 回你家网络解决（见 README）。
#
# ================================================================================
# 使用说明
# ================================================================================
#
# 1. Fork 本仓库到你的账号，并设为私有（保护你的账号信息）
#    Settings -> General -> Danger Zone -> Change visibility -> Make private
#
# 2. 添加 Secrets（Settings -> Secrets and variables -> Actions -> New repository secret）
#    - LINUXDO_USERNAME : 你的 Linux.do 用户名（必需）
#    - LINUXDO_PASSWORD : 你的 Linux.do 密码（必需）
#    - CLASH_SUB_CONTENT : 你的 Clash 订阅 YAML「文本内容」（推荐！见下方走代理说明）
#    - CLASH_SUB        : Clash 订阅链接（机场不拦 CI IP 时才可用）
#    - LINUXDO_PROXY    : 代理地址，如 http://127.0.0.1:7897（不配订阅时手工指定；留空 = 直连）
#    - CLOAKBROWSER_LICENSE_KEY : CloakBrowser 许可 key（可选但强烈建议，用于启用
#      最新内核；免费获取：https://cloakbrowser.dev/free 或 python -m cloakbrowser login）
#
# 3. 启用 Actions
#    Actions -> I understand my workflows, go ahead and enable them
#    （Fork 的仓库定时任务可能默认被禁用，需在 Actions 页手动启用）
#
# 4. 运行
#    - 手动触发：Actions -> Run Schedule -> Run workflow（可填参数）
#      「运行目标」填纯数字 = 浏览 N 个帖子（30）；带单位 = 按时长（30min / 1h）
#    - 定时触发：按下方 schedule cron 自动运行，默认 30min
#
# ================================================================================
# 走代理说明（解决 GitHub 出口 IP 被 linux.do 限流 429 的问题）
# ================================================================================
#
# GitHub Actions 的共享出口 IP 会被 linux.do 限流（HTTP 429 Too Many Requests），
# 表现为登录表单永远等不到。解决办法：配置 Clash 订阅，workflow 会：
#   1. 下载 mihomo（Clash.Meta 内核）到 runner
#   2. 加载你的订阅节点，启动本地代理（mixed-port 7897）
#   3. 自检：通过代理访问 linux.do，若仍 429 则切换到下一个节点再试
#   4. 浏览器流量走 http://127.0.0.1:7897，相当于把你电脑上的 Clash 搬进 CI
#
# 订阅支持两种 Secret（同时配置时优先用 CLASH_SUB_CONTENT）：
#   - CLASH_SUB_CONTENT : 订阅 YAML 的「文本内容」（推荐！）
#     很多机场把订阅接口放在 Cloudflare 后面并拦截数据中心 IP，
#     CI 上拉订阅会 403——直接贴内容可彻底绕开。
#     获取方法：本机浏览器打开订阅链接（会下载一个 .yaml 文件），
#     用记事本打开全选复制，粘到 Secret 里。
#   - CLASH_SUB         : 订阅链接（https:// 开头）。仅当机场不拦 CI IP 时可用；
#     一键导入链接（clash://install-config?url=...）无效
#
# 注意：
#   - 订阅链接/内容等同密码（含服务器地址和凭据），只放 Secrets，绝不写入日志
#   - 两个都不配且不配 LINUXDO_PROXY 时 = 直连，大概率被 429 拦截
#
# ================================================================================
# 定时规则说明
# ================================================================================
#
# cron 格式: 分 时 日 月 周
#
# 示例：
#   '0 1 * * *'    - 每天 UTC 1:00（北京时间 9:00）
#   '0 0,12 * * *' - 每天 UTC 0:00 和 12:00（北京时间 8:00 和 20:00）
#   '0 1 * * 1-5'  - 工作日 UTC 1:00（北京时间 9:00）
#
# 注意：GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8
#       schedule 最短间隔 5 分钟，但高峰期可能延迟几分钟到几十分钟
#
# ================================================================================

name: Run Schedule

on:
  # 定时触发（按需修改 cron；不需要定时就把下面两行注释掉）
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00 = 北京时间 9:00

  # 手动触发
  workflow_dispatch:
    inputs:
      target:
        description: '运行目标：纯数字=帖子数（30=30帖），带单位=时长（30min/1h）'
        required: false
        default: '30min'
      like_rate:
        description: '点赞概率 (0-100)'
        required: false
        default: '30'
      browse_mode:
        description: '浏览模式'
        required: false
        default: 'deep'
        type: choice
        options:
          - deep   # 深度爬楼（完整阅读）
          - quick  # 快速浏览（3-5 层换帖）

# 同一时间只允许一个浏览任务（上一次没跑完时，新的定时触发自动跳过排队）
concurrency:
  group: run-schedule
  cancel-in-progress: false

jobs:
  browse:
    # 见文件开头「为什么默认用 windows-latest」。换回 Linux 只改这一行。
    runs-on: windows-latest
    timeout-minutes: 60  # 最长运行 60 分钟

    # Windows 上 GitHub 默认 shell 是 pwsh，本文件所有 run 脚本都是 bash 写法
    # （$GITHUB_ENV、数组、[ -z ] 等），因此统一显式声明 bash（runner 自带 git-bash）
    defaults:
      run:
        shell: bash

    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 Python（项目要求 >= 3.12）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 安装 uv（项目用 uv 管理依赖，pyproject.toml + uv.lock）
      - name: Install uv
        run: python -m pip install --upgrade uv

      # 检测是否配置了 CloakBrowser 许可 key。
      # 有 key 用的是最新内核（CF 补丁更多、过挑战率更高），与免费内核是两个
      # 不同的二进制，必须用不同的缓存 key，否则会复用旧缓存而"看起来没生效"。
      - name: Detect CloakBrowser license
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          if [ -n "$CLOAKBROWSER_LICENSE_KEY" ]; then
            echo "CB_LIC=licensed" >> $GITHUB_ENV
            echo "已配置许可 key -> 使用最新内核"
          else
            echo "CB_LIC=free" >> $GITHUB_ENV
            echo "未配置许可 key -> 使用免费内核（过 Cloudflare 能力较弱）"
          fi

      # 算出内核缓存目录（跨平台：Windows 是 C:\Users\...\.cloakbrowser）
      - name: Resolve CloakBrowser cache dir
        run: |
          D="$(python -c "import os;print(os.path.expanduser('~/.cloakbrowser'))")"
          echo "CB_CACHE_DIR=$D" >> $GITHUB_ENV
          echo "内核缓存目录: $D"

      # 缓存 CloakBrowser 内核（~200MB），避免每次运行重新下载
      # 注意：缓存只在整个 job 成功时才保存——之前反复下载就是因为任务中途失败
      - name: Cache CloakBrowser binary
        uses: actions/cache@v4
        with:
          path: ${{ env.CB_CACHE_DIR }}
          key: cloakbrowser-${{ runner.os }}-x64-${{ env.CB_LIC }}-v3

      # 缓存浏览器 profile（登录态 + 已通过的 cf_clearance 跨运行累积）。
      # Cloudflare 对同一浏览器的重复通过会提升信任，每次全新 profile 等于
      # 每次从零开始挣信誉。排除 debug 截图，避免缓存膨胀。
      # 安全提示：profile 含登录 cookie，仅存在于本仓库的 Actions 缓存中；
      # 若仓库转公开或他人有写权限，请删除该缓存（Actions -> Caches）。
      - name: Cache browser profile
        uses: actions/cache@v4
        with:
          path: |
            browser_data/**
            !browser_data/debug/**
          key: profile-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            profile-${{ runner.os }}-

      # 安装项目依赖（CI 上改用官方 PyPI 源，忽略项目里的清华镜像配置）
      - name: Sync dependencies
        run: uv sync --frozen --default-index https://pypi.org/simple

      # 安装 Chromium 运行所需的系统库（仅 Linux 需要；必须先于内核安装——
      # cloakbrowser install 收尾会启动一次内核自检，缺库时直接 SIGSEGV/exit 139）
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: uv run playwright install-deps chromium

      # Linux 才需要补字体（Windows runner 自带真实系统字体，正是我们想要的自洽）
      # + xvfb：Linux 无显示器，CloakBrowser 需有头模式跑虚拟显示才能过 CF 挑战
      - name: Install fonts and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

      # 下载 CloakBrowser 隐身 Chromium 内核（已缓存则跳过下载）
      # install 自检历史上出现过 exit 139（段错误）——下载/校验其实已完成，
      # 故容错后单独验证二进制可执行，避免环境小问题炸掉整个任务
      - name: Install CloakBrowser binary
        env:
          # 必须在这一步就传入：内核是 install 时下载的，
          # 只在运行步骤传 key 会照样装了免费内核
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          uv run python -m cloakbrowser install || true
          # 缓存里可能同时存在多个版本目录，取版本号最高的（sort -V）
          # Windows 上二进制名是 chrome.exe，Linux 上是 chrome
          CHROME="$(ls -d "$HOME/.cloakbrowser"/chromium-*/chrome 2>/dev/null | sort -V | tail -1)"
          [ -z "$CHROME" ] && CHROME="$(ls -d "$HOME/.cloakbrowser"/chromium-*/chrome.exe 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CHROME" ]; then
            echo "::error::CloakBrowser 内核未找到，安装失败"
            exit 1
          fi
          echo "找到内核: $CHROME"
          # 打印实际使用的内核版本与层级，便于确认许可 key 是否生效
          uv run python -c 'from cloakbrowser import binary_info; i=binary_info(); print("实际内核: version=%s tier=%s" % (i.get("version"), i.get("tier")))' || true
          # 系统库已就位，这里能跑通即内核可用
          if ! "$CHROME" --version; then
            echo "::error::内核二进制无法运行（段错误）。请到 Actions -> Caches 删除 cloakbrowser-* 后重跑"
            exit 1
          fi
          echo "内核可正常执行 ✓"

      # ======================================================================
      # 启动 mihomo（Clash 内核）：订阅解析/配置/启动/节点自检全在 clash_proxy.py
      # （Python 脚本本机可直接调试：python clash_proxy.py --help）
      # 退出码 0 = 代理自检通过（mihomo 常驻供浏览步骤用）；非 0 = 降级直连（任务不失败）
      # ======================================================================
      - name: Setup Clash proxy (mihomo)
        env:
          CLASH_SUB: ${{ secrets.CLASH_SUB }}
          CLASH_SUB_CONTENT: ${{ secrets.CLASH_SUB_CONTENT }}
          CLASH_KEEP_RUNNING: '1'   # 自检通过后 mihomo 常驻，供浏览步骤走 127.0.0.1:7897
        run: |
          # 未配置任何订阅时跳过（secrets 不能用于 if 条件，这里在 shell 里判断）
          if [ -z "$CLASH_SUB" ] && [ -z "$CLASH_SUB_CONTENT" ]; then
            echo "未配置 CLASH_SUB / CLASH_SUB_CONTENT Secret，跳过代理设置"
            echo "PROXY_PASS=0" >> $GITHUB_ENV
            exit 0
          fi
          set +e
          uv run python clash_proxy.py
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "PROXY_PASS=1" >> $GITHUB_ENV
          else
            echo "PROXY_PASS=0" >> $GITHUB_ENV
            echo "::warning::代理自检未通过（退出码 $RC），浏览任务将直连重试"
          fi
          exit 0

      # 运行脚本（账号密码走 Secrets 自动登录）
      # 代理优先级：mihomo 自检通过 > LINUXDO_PROXY Secret > 直连
      # PROXY_PASS 由上一步写入 GITHUB_ENV，这里用 shell 变量读取（保证可用）
      - name: Run browse script
        env:
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
          LINUXDO_PROXY: ${{ secrets.LINUXDO_PROXY }}
          # 登录卡 Cloudflare 挑战时，bot 经此 API 换 Clash 出口节点再试（仅走代理时有意义）
          CLASH_ROTATE_API: http://127.0.0.1:9090
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          # 获取参数（手动触发时使用输入值，定时触发时使用默认值）
          TARGET="${{ github.event.inputs.target || '30min' }}"
          LIKE_RATE="${{ github.event.inputs.like_rate || '30' }}"
          BROWSE_MODE="${{ github.event.inputs.browse_mode || 'deep' }}"

          # 代理决策：mihomo 自检通过则强制走本地 7897；
          # 未通过但配置了 LINUXDO_PROXY 则用用户的代理；否则直连
          if [ "${PROXY_PASS:-0}" = "1" ]; then
            PROXY="http://127.0.0.1:7897"
            echo "走代理: mihomo (127.0.0.1:7897, 自检通过)"
          elif [ -n "${LINUXDO_PROXY}" ]; then
            PROXY="${LINUXDO_PROXY}"
            echo "走代理: LINUXDO_PROXY ($PROXY)"
          else
            PROXY=""
            echo "直连（未配置 CLASH_SUB / LINUXDO_PROXY，可能被 linux.do 限流）"
          fi

          echo "========================================"
          echo "开始运行 Linux.do 自动浏览 (CloakBrowser)"
          echo "运行系统: $RUNNER_OS"
          echo "运行目标: $TARGET（纯数字=帖子数，带单位=时长）"
          echo "点赞概率: $LIKE_RATE%"
          echo "浏览模式: $BROWSE_MODE"
          echo "========================================"

          # 有头模式：CloakBrowser 的无头模式会被 Cloudflare "Just a moment"
          # 挑战拦截。Linux runner 没有显示器，需 Xvfb 虚拟显示；
          # Windows runner 自带交互式桌面会话，直接有头运行即可。
          ARGS=(--target "$TARGET" --like-rate "$LIKE_RATE" --browse-mode "$BROWSE_MODE" --no-headless)
          if [ -n "$PROXY" ]; then
            ARGS+=(--proxy "$PROXY")
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            CMD=(xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run python main.py cli "${ARGS[@]}")
          else
            CMD=(uv run python main.py cli "${ARGS[@]}")
          fi
          # 浏览 0 个帖子时退出码为 1，任务标记失败以便收到通知
          "${CMD[@]}"

      # 输出结果摘要（无论成败）
      - name: Summary
        if: always()
        run: |
          echo "## 运行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 运行系统: $RUNNER_OS" >> $GITHUB_STEP_SUMMARY
          echo "- 运行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY

      # 失败时导出登录失败截图 / 页面快照（用于排查风控拦截；不含账号密码）
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: browser_data/debug/
          if-no-files-found: ignore
          retention-days: 7
