# ================================================================================
# Linux.do 自动浏览定时任务（无头 CLI · CloakBrowser）
# ================================================================================
#
# 功能：
#   - 定时/手动在 GitHub Actions 上运行无头命令行版（python main.py cli）
#   - CloakBrowser 隐身 Chromium 内核自动下载并缓存（约 200MB，首次后走缓存）
#   - 自动登录（账号密码来自 Secrets）并浏览帖子
#
# ================================================================================
# 使用说明
# ================================================================================
#
# 1. Fork 本仓库到你的账号，并设为私有（保护你的账号信息）
#    Settings -> General -> Danger Zone -> Change visibility -> Make private
#
# 2. 添加 Secrets（Settings -> Secrets and variables -> Actions -> New repository secret）
#    - LINUXDO_USERNAME : 你的 Linux.do 用户名（必需）
#    - LINUXDO_PASSWORD : 你的 Linux.do 密码（必需）
#    - CLASH_SUB        : 你的 Clash/Clash Verge 订阅链接（推荐！见下方「走代理」说明）
#    - LINUXDO_PROXY    : 代理地址，如 http://127.0.0.1:7897（不配 CLASH_SUB 时手工指定；留空 = 直连）
#    - CLOAKBROWSER_LICENSE_KEY : CloakBrowser 许可 key（可选，用于获取最新内核；
#      免费获取：https://cloakbrowser.dev/free 或 python -m cloakbrowser login）
#
# 3. 启用 Actions
#    Actions -> I understand my workflows, go ahead and enable them
#    （Fork 的仓库定时任务可能默认被禁用，需在 Actions 页手动启用）
#
# 4. 运行
#    - 手动触发：Actions -> Run Schedule -> Run workflow（可填参数）
#      「运行目标」填纯数字 = 浏览 N 个帖子（30）；带单位 = 按时长（30min / 1h）
#    - 定时触发：按下方 schedule cron 自动运行，默认 30min
#
# ================================================================================
# 走代理说明（解决 GitHub 出口 IP 被 linux.do 限流 429 的问题）
# ================================================================================
#
# GitHub Actions 的共享出口 IP 会被 linux.do 限流（HTTP 429 Too Many Requests），
# 表现为登录表单永远等不到。解决办法：配置 Clash 订阅，workflow 会：
#   1. 下载 mihomo（Clash.Meta 内核）到 runner
#   2. 加载你的订阅节点，启动本地代理（mixed-port 7897）
#   3. 自检：通过代理访问 linux.do，若仍 429 则切换到下一个节点再试
#   4. 浏览器流量走 http://127.0.0.1:7897，相当于把你电脑上的 Clash 搬进 CI
#
# 订阅支持两种 Secret（同时配置时优先用 CLASH_SUB_CONTENT）：
#   - CLASH_SUB_CONTENT : 订阅 YAML 的「文本内容」（推荐！）
#     很多机场把订阅接口放在 Cloudflare 后面并拦截数据中心 IP，
#     CI 上拉订阅会 403——直接贴内容可彻底绕开。
#     获取方法：本机浏览器打开订阅链接（会下载一个 .yaml 文件），
#     用记事本打开全选复制，粘到 Secret 里。
#   - CLASH_SUB         : 订阅链接（https:// 开头）。仅当机场不拦 CI IP 时可用；
#     一键导入链接（clash://install-config?url=...）无效
#
# 注意：
#   - 订阅链接/内容等同密码（含服务器地址和凭据），只放 Secrets，绝不写入日志
#   - 两个都不配且不配 LINUXDO_PROXY 时 = 直连，大概率被 429 拦截
#
# ================================================================================
# 定时规则说明
# ================================================================================
#
# cron 格式: 分 时 日 月 周
#
# 示例：
#   '0 1 * * *'    - 每天 UTC 1:00（北京时间 9:00）
#   '0 0,12 * * *' - 每天 UTC 0:00 和 12:00（北京时间 8:00 和 20:00）
#   '0 1 * * 1-5'  - 工作日 UTC 1:00（北京时间 9:00）
#
# 注意：GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8
#       schedule 最短间隔 5 分钟，但高峰期可能延迟几分钟到几十分钟
#
# ================================================================================

name: Run Schedule

on:
  # 定时触发（按需修改 cron；不需要定时就把下面两行注释掉）
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00 = 北京时间 9:00

  # 手动触发
  workflow_dispatch:
    inputs:
      target:
        description: '运行目标：纯数字=帖子数（30=30帖），带单位=时长（30min/1h）'
        required: false
        default: '30min'
      like_rate:
        description: '点赞概率 (0-100)'
        required: false
        default: '30'
      browse_mode:
        description: '浏览模式'
        required: false
        default: 'deep'
        type: choice
        options:
          - deep   # 深度爬楼（完整阅读）
          - quick  # 快速浏览（3-5 层换帖）

# 同一时间只允许一个浏览任务（上一次没跑完时，新的定时触发自动跳过排队）
concurrency:
  group: run-schedule
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 最长运行 60 分钟

    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 Python（项目要求 >= 3.12）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 安装 uv（项目用 uv 管理依赖，pyproject.toml + uv.lock）
      - name: Install uv
        run: python -m pip install --upgrade uv

      # 缓存 CloakBrowser 内核（~200MB），避免每次运行重新下载
      # 如需强制更新内核：Actions -> 管理缓存 -> 删除该缓存后重跑
      - name: Cache CloakBrowser binary
        uses: actions/cache@v4
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}-x64

      # 安装项目依赖（CI 上改用官方 PyPI 源，忽略项目里的清华镜像配置）
      - name: Sync dependencies
        run: uv sync --frozen --default-index https://pypi.org/simple

      # 安装 Chromium 运行所需的系统库（必须先于内核安装——
      # cloakbrowser install 收尾会启动一次内核自检，缺库时直接 SIGSEGV/exit 139）
      - name: Install system dependencies
        run: uv run playwright install-deps chromium

      # 安装字体（CloakBrowser 在 Linux 上伪装 Windows 指纹，
      # 缺字体会导致 canvas 指纹异常、更容易被风控拦截）
      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

      # 下载 CloakBrowser 隐身 Chromium 内核（已缓存则跳过下载）
      # install 自检历史上出现过 exit 139（段错误）——下载/校验其实已完成，
      # 故容错后单独验证二进制可执行，避免环境小问题炸掉整个任务
      - name: Install CloakBrowser binary
        run: |
          uv run python -m cloakbrowser install || true
          CHROME="$(ls "$HOME/.cloakbrowser"/chromium-*/chrome 2>/dev/null | head -1)"
          if [ -z "$CHROME" ]; then
            echo "::error::CloakBrowser 内核未找到，安装失败"
            exit 1
          fi
          echo "找到内核: $CHROME"
          # 系统库已就位，这里能跑通即内核可用
          if ! "$CHROME" --version; then
            echo "::error::内核二进制无法运行（段错误）。请到 Actions -> Caches 删除 cloakbrowser-* 后重跑；持续失败可把 runs-on 改为 ubuntu-22.04 再试"
            exit 1
          fi
          echo "内核可正常执行 ✓"

      # ======================================================================
      # 启动 mihomo（Clash 内核）：把订阅节点搬进 CI，绕开 GitHub 出口 IP 限流
      # 配了 CLASH_SUB 才启用；跑完后浏览器走 http://127.0.0.1:7897
      # ======================================================================
      - name: Setup Clash proxy (mihomo)
        env:
          CLASH_SUB: ${{ secrets.CLASH_SUB }}
          CLASH_SUB_CONTENT: ${{ secrets.CLASH_SUB_CONTENT }}
        run: |
          # 未配置任何订阅时跳过（secrets 不能用于 if 条件，这里在 shell 里判断）
          if [ -z "$CLASH_SUB" ] && [ -z "$CLASH_SUB_CONTENT" ]; then
            echo "未配置 CLASH_SUB / CLASH_SUB_CONTENT Secret，跳过代理设置"
            echo "PROXY_PASS=0" >> $GITHUB_ENV
            exit 0
          fi
          set -e
          # ---- 下载 mihomo 内核（固定版本，保证可复现） ----
          MIHOMO_VER="v1.19.32"
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-amd64-${MIHOMO_VER}.gz" -o mihomo.gz
          gunzip -f mihomo.gz && chmod +x mihomo
          ./mihomo -v

          mkdir -p mihomo-work
          # ---- 准备节点源：优先用订阅内容（CI 拉订阅常被机场的 Cloudflare 拦 403） ----
          if [ -n "$CLASH_SUB_CONTENT" ]; then
            echo "模式: 使用 CLASH_SUB_CONTENT（订阅内容直接注入，不经网络）"
            # Secret 粘贴的内容可能有 CRLF / BOM，规范化后写入，base64 兜底防排版损坏
            printf '%s' "$CLASH_SUB_CONTENT" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' > mihomo-work/sub-content.yaml
            if ! grep -q "proxies:" mihomo-work/sub-content.yaml; then
              # 粘贴可能丢换行导致 YAML 损坏；内容疑似 base64 时尝试解码
              echo "内容里没有 proxies: 字段，尝试按 base64 解码..."
              if printf '%s' "$CLASH_SUB_CONTENT" | tr -d '\r\n ' | base64 -d 2>/dev/null | grep -q "proxies:"; then
                printf '%s' "$CLASH_SUB_CONTENT" | tr -d '\r\n ' | base64 -d > mihomo-work/sub-content.yaml
                echo "base64 解码成功"
              else
                echo "::error::CLASH_SUB_CONTENT 内容无效：既不是含 proxies: 的 YAML，也不是 base64 订阅。请重新复制完整订阅文件内容"
                echo "PROXY_PASS=0" >> $GITHUB_ENV
                exit 0
              fi
            fi
            PROVIDER_TYPE="file"
            PROVIDER_SRC="sub-content.yaml"
          else
            echo "模式: 使用 CLASH_SUB 订阅链接"
            # ---- 预检订阅链接：常见复制错误在这里就能发现 ----
            if [[ "$CLASH_SUB" == clash://* ]]; then
              echo "::error::CLASH_SUB 填的是 clash:// 一键导入链接，请改填原始订阅地址（https:// 开头，Clash Verge 里「编辑订阅」可看到真实 URL）；或改用 CLASH_SUB_CONTENT 直接贴订阅内容"
              echo "PROXY_PASS=0" >> $GITHUB_ENV
              exit 0
            fi
            if [[ "$CLASH_SUB" != https://* && "$CLASH_SUB" != http://* ]]; then
              echo "::error::CLASH_SUB 不是有效的 http(s) 订阅链接（当前前缀: ${CLASH_SUB:0:8}...）"
              echo "PROXY_PASS=0" >> $GITHUB_ENV
              exit 0
            fi
            SUB_CODE=$(curl -sL -o /tmp/sub_probe.yaml -w '%{http_code}' --max-time 20 \
              -A "clash-verge/v1.7.7" "$CLASH_SUB" || echo 000)
            SUB_SIZE=$(wc -c < /tmp/sub_probe.yaml 2>/dev/null || echo 0)
            echo "订阅预检: HTTP $SUB_CODE, ${SUB_SIZE} 字节"
            if [ "$SUB_CODE" != "200" ] || [ "$SUB_SIZE" -lt 50 ]; then
              echo "::error::订阅链接拉取失败（HTTP $SUB_CODE）——机场的 Cloudflare 大概率拦截了 CI 的数据中心 IP。请改用 CLASH_SUB_CONTENT：本机浏览器打开订阅链接下载 .yaml，全选复制内容粘进 Secret"
              echo "PROXY_PASS=0" >> $GITHUB_ENV
              exit 0
            fi
            PROVIDER_TYPE="http"
            PROVIDER_SRC="$CLASH_SUB"
          fi

          # ---- 生成最小配置：本地 mixed 端口 7897 + 订阅作为 provider ----
          # 规则模式 + MATCH 全走 PROXY 组；不启用 TUN/系统代理，仅本地端口
          # （用 printf 逐行写入，避免 heredoc 结束符与 YAML 块标量缩进冲突）
          {
            echo 'mixed-port: 7897'
            echo 'allow-lan: false'
            echo 'mode: rule'
            echo 'log-level: info'
            echo 'external-controller: 127.0.0.1:9090'
            echo 'proxy-providers:'
            echo '  sub:'
            echo "    type: $PROVIDER_TYPE"
            if [ "$PROVIDER_TYPE" = "file" ]; then
              echo "    path: $PROVIDER_SRC"
            else
              echo "    url: \"$PROVIDER_SRC\""
              echo '    header:'
              echo '      User-Agent:'
              echo '        - clash-verge/v1.7.7'
            fi
            echo '    interval: 86400'
            echo '    health-check:'
            echo '      enable: true'
            echo '      url: https://www.gstatic.com/generate_204'
            echo '      interval: 300'
            echo 'proxy-groups:'
            echo '  - name: PROXY'
            echo '    type: select'
            echo '    use:'
            echo '      - sub'
            echo 'rules:'
            echo '  - MATCH,PROXY'
          } > mihomo-work/config.yaml
          # http 模式下订阅链接替换进配置（文件在 runner 本地，不打印内容）
          # 用 perl 而非 sed：订阅 URL 常含 & 等字符，sed 替换串里 & 是特殊字符会写坏链接
          if [ "$PROVIDER_TYPE" = "http" ]; then
            CLASH_SUB="$CLASH_SUB" perl -pe 's/CLASH_SUB_PLACEHOLDER/$ENV{CLASH_SUB}/g' -i mihomo-work/config.yaml
          fi

          # ---- 启动内核（后台常驻） ----
          ./mihomo -d mihomo-work > mihomo-work/mihomo.log 2>&1 &
          sleep 5

          # ---- 等代理端口就绪 ----
          PORT_OK=0
          for i in $(seq 1 15); do
            if curl -x http://127.0.0.1:7897 -s -o /dev/null --max-time 5 https://www.gstatic.com/generate_204; then
              echo "mihomo 端口 7897 就绪"
              PORT_OK=1
              break
            fi
            # 进程已退出就直接放弃，不用等满 15 轮
            if ! kill -0 $(pgrep -f "mihomo -d" | head -1) 2>/dev/null; then
              echo "mihomo 进程已退出"
              break
            fi
            echo "等待 mihomo 启动... ($i/15)"
            sleep 2
          done
          if [ "$PORT_OK" != "1" ]; then
            echo "::warning::mihomo 启动失败，日志如下（Secret 值已被 GitHub 自动打码）："
            cat mihomo-work/mihomo.log || true
            echo "PROXY_PASS=0" >> $GITHUB_ENV
            exit 0
          fi

          # ---- 连通自检：逐个节点试到 linux.do 返回 200 为止 ----
          # linux.do 对无 Cookie 的 curl 探测也可能回 403 challenge，
          # 所以把 200 视为通过；403 也算「可达」（说明没被 429 限流，浏览器能过挑战）
          PROBE_OK=0
          for i in $(seq 0 9); do
            CODE=$(curl -x http://127.0.0.1:7897 -s -o /dev/null -w '%{http_code}' \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36" \
              --max-time 20 https://linux.do/ || echo 000)
            echo "节点#$i 访问 linux.do -> HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "403" ]; then PROBE_OK=1; break; fi
            # 切换到 provider 列表里的下一个节点（9090 API 只在 runner 本地，安全）
            NEXT=$(curl -s "http://127.0.0.1:9090/providers/proxies/sub" | jq -r ".all[$((i+1))] // empty" 2>/dev/null)
            [ -z "$NEXT" ] && break
            curl -s -X PUT "http://127.0.0.1:9090/proxies/PROXY" -d "{\"name\":\"$NEXT\"}" > /dev/null
            sleep 2
          done

          if [ "$PROBE_OK" = "1" ]; then
            echo "PROXY_PASS=1" >> $GITHUB_ENV
            echo "✅ 代理自检通过，浏览任务将走 Clash 节点"
          else
            echo "PROXY_PASS=0" >> $GITHUB_ENV
            echo "::warning::代理自检未通过（所有节点都无法打开 linux.do），日志如下："
            tail -n 30 mihomo-work/mihomo.log || true
            echo "::warning::浏览任务将直连重试"
          fi

      # 运行脚本（无头模式，账号密码走 Secrets 自动登录）
      # 代理优先级：mihomo 自检通过 > LINUXDO_PROXY Secret > 直连
      - name: Run browse script
        env:
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
          LINUXDO_PROXY: ${{ secrets.LINUXDO_PROXY }}
          CLASH_PROXY_PASS: ${{ env.PROXY_PASS }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          # 获取参数（手动触发时使用输入值，定时触发时使用默认值）
          TARGET="${{ github.event.inputs.target || '30min' }}"
          LIKE_RATE="${{ github.event.inputs.like_rate || '30' }}"
          BROWSE_MODE="${{ github.event.inputs.browse_mode || 'deep' }}"

          # 代理决策：mihomo 自检通过则强制走本地 7897；
          # 未通过但配置了 LINUXDO_PROXY 则用用户的代理；否则直连
          if [ "${CLASH_PROXY_PASS}" = "1" ]; then
            PROXY="http://127.0.0.1:7897"
            echo "走代理: mihomo (127.0.0.1:7897, 自检通过)"
          elif [ -n "${LINUXDO_PROXY}" ]; then
            PROXY="${LINUXDO_PROXY}"
            echo "走代理: LINUXDO_PROXY ($PROXY)"
          else
            PROXY=""
            echo "直连（未配置 CLASH_SUB / LINUXDO_PROXY，可能被 linux.do 限流）"
          fi

          echo "========================================"
          echo "开始运行 Linux.do 自动浏览 (CloakBrowser)"
          echo "运行目标: $TARGET（纯数字=帖子数，带单位=时长）"
          echo "点赞概率: $LIKE_RATE%"
          echo "浏览模式: $BROWSE_MODE"
          echo "========================================"

          # 浏览 0 个帖子时退出码为 1，任务标记失败以便收到通知
          if [ -n "$PROXY" ]; then
            uv run python main.py cli \
              --target "$TARGET" \
              --like-rate "$LIKE_RATE" \
              --browse-mode "$BROWSE_MODE" \
              --proxy "$PROXY"
          else
            uv run python main.py cli \
              --target "$TARGET" \
              --like-rate "$LIKE_RATE" \
              --browse-mode "$BROWSE_MODE"
          fi

      # 输出结果摘要（无论成败）
      - name: Summary
        if: always()
        run: |
          echo "## 运行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 运行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY

      # 失败时导出登录失败截图 / 页面快照（用于排查风控拦截；不含账号密码）
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: browser_data/debug/
          if-no-files-found: ignore
          retention-days: 7
